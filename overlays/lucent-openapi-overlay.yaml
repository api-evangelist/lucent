overlay: 1.0.0
info:
  title: API Evangelist enhancements for Lucent API
  version: 1.0.0
extends: openapi/lucent-openapi-original.json
actions:
- target: $.info
  update:
    x-apievangelist-rating: 4
    x-apievangelist-notes: >-
      Clean OpenAPI 3.1 with operationIds, per-status responses, two security schemes, and reusable
      schemas. Idempotency is documented (replay per sessionId+sequence; idempotent status updates)
      and a hosted MCP server plus OAuth 2.1 (RFC 8414/9728/7591 + PKCE) sit in front of the Data API.
- target: $.info
  update:
    x-artifacts:
      mcp: mcp/lucent-mcp.yml
      webhooks: asyncapi/lucent-webhooks-asyncapi.yml
      conventions: conventions/lucent-conventions.yml
      errors: errors/lucent-problem-types.yml
      scopes: scopes/lucent-scopes.yml
      authentication: authentication/lucent-authentication.yml
      data_model: data-model/lucent-data-model.yml
- target: $.paths['/api/v1/issues'].get
  update:
    x-agentic-access:
      action-class: connected
      consequence: read
- target: $.paths['/api/v1/issues/{issueId}'].patch
  update:
    x-idempotent: true
    x-agentic-access:
      action-class: acting
      consequence: write
