name: Lucent
description: >-
  Lucent is an AI product manager for session replay: it watches user session
  recordings continuously and automatically detects bugs and UX issues,
  surfacing them as prioritized, AI-verified issues with reproduction steps,
  console logs, network activity, and affected-user counts. It ingests rrweb
  session batches from a lightweight browser SDK (plus React Native and Flutter),
  imports replays from providers such as PostHog and Sentry, and exposes a REST
  Data API to read issues, signals, and insights and to update issue status,
  webhooks for issue events, and a hosted Model Context Protocol (MCP) server so
  agents like Claude and Cursor can query Lucent data directly. Founded 2025,
  Y Combinator Winter 2026 batch.
