authentication:
  methods:
  - type: oauth
    recommended: true
    note: OAuth 2.1 with Dynamic Client Registration, PKCE (S256), and rotating refresh tokens. Access tokens prefixed `luc_oat_` (1-hour TTL); 30-day refresh tokens.
    metadata:
    - well-known/lucent-oauth-authorization-server.json
    - well-known/lucent-oauth-protected-resource.json
  - type: bearer
    note: Long-lived static tokens prefixed `luc_mcp_`, created in Organization settings and shown once (stored as SHA-256 hashes).
  header: 'Authorization: Bearer <token>'
