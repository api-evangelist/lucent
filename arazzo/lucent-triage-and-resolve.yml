arazzo: 1.0.1
info:
  title: Lucent — triage and resolve an issue
  version: 1.0.0
  description: List unresolved issues, fetch the top one, and mark it resolved.
  x-realizes-capability-ids:
  - BC-4200.50
  x-capability-derivation:
    method: 'deterministic join: sourceDescriptions -> per-tag OpenAPI -> tag/capability edge. No classification at this step.'
    min_confidence: 0.7
    sources:
    - capability_id: BC-4200.50
      capability_name: Software Quality Engineering
      spec: lucent-issues-api-openapi.yml
      confidence: 0.75
    model: Turbo EA Capabilities by Vincent Verdet — Turbo EA, https://github.com/vincentmakes/turbo-ea-capabilities, CC BY 4.0
sourceDescriptions:
- name: issuesApi
  url: ../openapi/lucent-issues-api-openapi.yml
  type: openapi
workflows:
- workflowId: triageAndResolveIssue
  summary: Find the newest unresolved issue and resolve it.
  inputs:
    type: object
    properties:
      token:
        type: string
        description: Bearer token with read:lucent and write:issues.
  steps:
  - stepId: listUnresolved
    operationId: listIssues
    parameters:
    - name: status
      in: query
      value: unresolved
    - name: limit
      in: query
      value: 1
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      issueId: $response.body#/issues/0/id
  - stepId: getIssue
    operationId: getIssue
    parameters:
    - name: issueId
      in: path
      value: $steps.listUnresolved.outputs.issueId
    successCriteria:
    - condition: $statusCode == 200
  - stepId: resolveIssue
    operationId: updateIssueStatus
    parameters:
    - name: issueId
      in: path
      value: $steps.listUnresolved.outputs.issueId
    requestBody:
      contentType: application/json
      payload:
        status: resolved
    successCriteria:
    - condition: $statusCode == 200
  outputs:
    resolvedIssueId: $steps.listUnresolved.outputs.issueId
